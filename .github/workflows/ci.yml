name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # Job 1: Frontend Verification (Next.js)
  # ==========================================
  frontend-ci:
    name: Frontend (Typecheck, Lint & Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Get pnpm Store Directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm Cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend Typecheck
        run: pnpm --filter @techseeker/web typecheck

      - name: Frontend Build Verification
        run: pnpm --filter @techseeker/web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: mock_client_id

  # ==========================================
  # Job 2: Backend Verification (FastAPI + Pytest)
  # ==========================================
  backend-ci:
    name: Backend (Pytest Suite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run Backend Pytest Suite
        working-directory: apps/api
        env:
          APP_NAME: TechSeeker API Test
          APP_VERSION: 1.0.0
          ENVIRONMENT: test
          DEBUG: "false"
          DATABASE_URL: sqlite:///./test.db
          DIRECT_URL: sqlite:///./test.db
          SECRET_KEY: test_secret_key_ci_environment_minimum_32_chars
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 60
          GEMINI_API_KEYS: mock_gemini_key_for_testing
          RUNNER_SERVICE_URL: http://127.0.0.1:8001/execute
          CORS_ORIGINS: http://localhost:3000
        run: |
          pytest tests -v
