version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-techseeker}
      POSTGRES_USER: ${POSTGRES_USER:-techseeker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-techseeker}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  code-runner:
    build:
      context: ./apps/runner
      dockerfile: Dockerfile
    expose:
      - "8001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    mem_limit: 512m
    cpus: 1.0
    tmpfs:
      - /tmp:rw,size=128m
    restart: unless-stopped

volumes:
  postgres_data:
